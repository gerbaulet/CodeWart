# Builds Codewart installers for macOS (universal), Linux and Windows, attaches
# them to a GitHub release and publishes it once every platform succeeded.
# Trigger: push a tag like v0.1.0 (`make release`). Running it manually from
# the Actions tab only builds (installers are kept as workflow artifacts).
#
# Each release also gets copies under stable names, so these links always point
# at the newest version (the landing page in site/ uses them):
#   https://github.com/<owner>/<repo>/releases/latest/download/Codewart-macos-universal.dmg
#   …/Codewart-windows-x64-setup.exe, Codewart-windows-x64.msi,
#   …/Codewart-linux-amd64.AppImage, Codewart-linux-amd64.deb, Codewart-linux-x86_64.rpm
#
# macOS signing / notarization (optional, recommended for distribution):
# add these repository secrets and the build is signed and notarized:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Codewart ${{ github.ref_name }}
          releaseBody: |
            Install the app, open it once and click **Install `wart`** in the top bar
            (or run `make install-cli` from a checkout). Then run `wart .` in any repo.
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Keep installers as workflow artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: codewart-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  # The release stays a draft until all platforms are built, so a failed
  # platform never leaves a half-empty public release behind.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Attach installers under stable names
        run: |
          set -euo pipefail
          mkdir dl stable && cd dl
          gh release download "$TAG" -p '*.dmg' -p '*.msi' -p '*-setup.exe' -p '*.AppImage' -p '*.deb' -p '*.rpm'
          ls -l
          copy() { f=$(ls $1 2>/dev/null | head -1); if [ -n "$f" ]; then cp "$f" "../stable/$2"; else echo "::warning::no asset matching $1"; fi; }
          copy '*universal.dmg'  Codewart-macos-universal.dmg
          copy '*x64-setup.exe'  Codewart-windows-x64-setup.exe
          copy '*x64*.msi'       Codewart-windows-x64.msi
          copy '*.AppImage'      Codewart-linux-amd64.AppImage
          copy '*amd64.deb'      Codewart-linux-amd64.deb
          copy '*.rpm'           Codewart-linux-x86_64.rpm
          cd ../stable && gh release upload "$TAG" --clobber ./*

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
